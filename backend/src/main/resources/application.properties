spring.application.name=sgap-backend
server.port=${PORT:8081}
server.forward-headers-strategy=framework

# Load local .env automatically on developer machines (ignored by Git; absent in Render container)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database Connectivity (local MySQL fallback; set DB_URL / DB_USER / DB_PASSWORD in .env or cloud env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_guide_allocation_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (sized cleanly for 512MB Render Free & TiDB Serverless)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL Schema Initialization (uses CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql

# Multipart File Uploads (Excel/CSV bulk import)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Security, JWT & CORS (supply JWT_SECRET & CORS_ALLOWED_ORIGINS via env vars)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.auth-rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:40}

# Initial Admin Bootstrap (creates Admin on empty DB only when ADMIN_INITIAL_PASSWORD is provided)
app.admin.username=${ADMIN_USERNAME:ADM001}
app.admin.email=${ADMIN_EMAIL:admin@university.edu}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# Spring Boot Actuator Health Endpoint for Cloud Readiness Probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Prevent Stack Trace / Internal Detail Leakage
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.university.sgap=${LOG_LEVEL_APP:INFO}
