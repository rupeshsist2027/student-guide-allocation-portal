# Production Profile Settings (activated with SPRING_PROFILES_ACTIVE=prod on Render)
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=4
# Fail closed on CORS in production unless CORS_ALLOWED_ORIGINS is explicitly provided
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
